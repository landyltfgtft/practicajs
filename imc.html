<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="imc.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>Calculadora IMC</title>
   
</head>
<body>
<div class="container mt-5">
    <div>
        <h2 class="text-center mb-4">
            Calculadora de IMC
        </h2>
        <img src="imc.jpeg" alt="Logo" width="30px" height="24"  class="d-inline-block align-text-top">
        <div class="mb-4">
            <label class="form-label">
                Peso<span id="valorPeso">70</span> kg
            </label>
            <input type="range" class="form-range" id="peso" min="30" max="150" value="70">
        </div>
        <div class="mb-4">
            <label class="form-label">
                Altura: <span id="valorAltura">1.70</span> m
            </label>
            <input type="range" class="form-range" id="altura" min="1.20" max="2.20" step="0.01" value="1.70">
        </div>
        <div class="resultado text-center p-3 rounded">
            <h3>IMC</h3>
            <h1 id="imc">24.22</h1>
            <h4 id="clasificacion"> Normal</h4>
        </div>
        <button class="btn btn-secondary mt-4" onclick="reset()">reset</button>
    </div>
    <div class="card mt-4 p-3">
        <h4 class="text-center">
            Tabla de Clasificación
        </h4>

        <table class="table table-bordered text-center">
            <thead>
                <tr>
                    <th>IMC</th>
                    <th>Clasificación</th>
                </tr>
            </thead>

            <tbody>
                <tr class="azul">
                    <td>Menor a 18.5</td>
                    <td>Bajo peso</td>
                </tr>
                <tr class="verde">
                    <td>18.5 - 24.9</td>
                    <td>Normal</td>
                </tr>
                <tr class="amarillo">
                    <td>25 - 29.9</td>
                    <td>Sobrepeso</td>
                </tr>
                <tr class="naranja">
                    <td>30 - 34.9</td>
                    <td>Obesidad I</td>
                </tr>
                <tr class="rojo">
                    <td>35 - 39.9</td>
                    <td>Obesidad II</td>
                </tr>
                <tr class="rojo-oscuro">
                    <td>40 o mas</td>
                    <td>Obesidad III</td>
                </tr>
        </table>
    </div>
</div>
<script src="imc.js"></script>
</body>
</html>
