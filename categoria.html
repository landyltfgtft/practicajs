<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- DataTables + Buttons CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css">
    <title>PRACTICAS JAVASCRIPT</title>
    <style>
        .dataTables_wrapper .dataTables_filter,
        .dataTables_wrapper .dataTables_filter label,
        .dataTables_wrapper .dataTables_length,
        .dataTables_wrapper .dataTables_length label,
        .dataTables_wrapper .dataTables_info {
            color: #212529 !important;
        }
        .dataTables_wrapper .dataTables_filter input {
            color: #212529 !important;
            background-color: #ffffff !important;
            border: 1px solid #ced4da !important;
        }
    </style>
</head>
<body class="bg-light">

    <div class="d-flex vh-100">
        
        <div class="d-flex flex-column flex-shrink-0 p-3 bg-dark text-white" style="width: 260px;">
            <a href="menu.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <img src="img/OIP.jpg" alt="Logo" width="30" height="24" class="rounded me-2">
                <span class="fs-5 fw-bold">TIENDITA</span>
            </a>
            <hr class="text-white">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item mb-1">
                    <a href="tiendita.html" class="nav-link text-white">
                        <i class="bi bi-hearts"></i> Productos
                    </a>
                </li>
                <li class="nav-item mb-1">
                    <a href="categorias.html" class="nav-link text-white active">
                        <i class="bi bi-star"></i> Categorías
                    </a>
                </li>
            </ul>
        </div>

        <div class="flex-grow-1 p-4 overflow-auto">
            <div class="container p-4 bg-inverse mt-3 card shadow-sm">
                <h1 class="text-center" style="color:black;">CATEGORIAS</h1><hr>
                <div class="d-flex justify-content-end mb-3">
                     <button type="button" class="btn-solid btn-styled theme-primary w-25" data-bs-toggle="dialog" data-bs-target="#addCategorias">
                         <i class="bi bi-folder-plus"></i> Agregar
                     </button>
                </div>
                <table id="tablaCategorias" class="table table-striped table-hover mt-3 w-100">
                    <thead>
                        <tr class="text-center">
                            <th>CATEGORÍA</th>
                            <th>ACCIÓN</th>
                        </tr>
                    </thead>
                    <tbody id="categorias"></tbody>
                </table>
            </div>
        </div>

    </div>

    <dialog class="dialog" id="addCategorias">
      <div class="dialog-header">
        <h1 class="dialog-title">AGREGAR CATEGORÍA</h1>
        <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
      </div>
      <div class="dialog-body">
        <h3>NOMBRE DE LA CATEGORÍA</h3>
        <input type="text" id="nombreCategoria" class="form-control"><br>
      </div>
      <div class="dialog-footer">
        <button type="button" class="btn-solid theme-danger" data-bs-dismiss="dialog"><i class="bi bi-x-circle"></i>Cancelar</button>
        <button type="button" class="btn-solid theme-success" id="btnSave"><i class="bi bi-floppy-fill"></i>Guardar</button>
      </div>
    </dialog>

    <dialog class="dialog" id="editCategoria">
        <div class="dialog-header">
            <h1 class="dialog-title">EDITAR CATEGORÍA</h1>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <div class="dialog-body">
            <input type="hidden" id="posicion">
            <h3>NOMBRE DE LA CATEGORÍA</h3>
            <input type="text" id="nombreCategoriae" class="form-control"><br>
        </div>
        <div class="dialog-footer">
            <button type="button" class="btn-solid theme-danger" data-bs-dismiss="dialog">
                <i class="bi bi-x-circle-fill"></i>Cancelar
            </button>
            <button type="button" class="btn-solid theme-success" id="btnEdit">
                <i class="bi bi-box-arrow-down"></i>Guardar
            </button>
        </div>
    </dialog>

    <!-- jQuery + DataTables + JSZip (Excel) + pdfMake (PDF) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>

    <script type="module" src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
    <script src="categoria.js"></script>
</body>
</html>
